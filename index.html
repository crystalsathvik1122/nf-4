<!DOCTYPE html>
<html lang="en">
<head>
    <title>my science lab</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <style>
        body{
            background-color:#f4fff4;
            font-family:arial, sans-serif;

        }

        .jumbotron{
            background-color:#e6f9ec;
            border-left:6px solid #FF5A43;
        }

        .jumbotron H1{
            color:#FF5A43;
        }

        .section-title{
            color:#FF5A43;

        }

        p{
            font-weight:bold;
            margin-bottom:5px;
        }


    </style>
</head>
<body>
    <div class="jumbotron jumbotron-fluid">
        <div class="container">
          <h1>my science lab</h1>
          <p class="lead">wlecome to the lab!here are the experiments running,the discoveries made, and how far each project has come</p>

          <button>chemistry</button>
          <button>biology</button>
          <button>physics</button>
          <button>astronomy</button>
        </div>
    </div>

    <div class="container">
        <h2 class="section title">
            experiments completed
            <span class="badge badge-danger">4</span>
        </h2>

        <p>chemistry <span class="badge badge-primary">7 experiment</span></p>
        <p>biology <span class="badge badge-success">5 experiments</span></p>
        <p>physics <span class="badge badge-warning">3 experiments</span></p>
        <p>astronomy <span class="badge badge-info">4 experiments</span></p>

        <h2 class="section-title">research progress</h2>
        <p>chemistry</p>
        <div class="progress mb-3">
            <div class="progress-bar bg-primary" style="width:85%">85%</div>
        </div>
    </div>

</body>
</html>
